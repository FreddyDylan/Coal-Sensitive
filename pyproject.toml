[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coal-sensitive"
version = "0.1.0"
description = "Hydraulic network modelling of coal permeability stress sensitivity and fracture contributions"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Coal-Sensitive contributors"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.14,<2"]

[project.urls]
Repository = "https://github.com/FreddyDylan/Coal-Sensitive"
Issues = "https://github.com/FreddyDylan/Coal-Sensitive/issues"

[project.scripts]
coal-sensitive = "coal_sensitive:main"

[tool.setuptools]
py-modules = ["coal_sensitive"]
